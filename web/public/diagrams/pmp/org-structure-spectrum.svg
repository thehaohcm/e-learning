<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Phổ cấu trúc tổ chức từ Functional đến Weak, Balanced, Strong Matrix đến Projectized, với đường quyền lực của PM tăng dần từ trái sang phải." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="o1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <text x="500" y="20" text-anchor="middle" font-size="12" fill="#64748b">Quyền lực của PM tăng dần →</text>
  <line x1="40" y1="46" x2="960" y2="46" stroke="#4f46e5" stroke-width="2" marker-end="url(#o1)"/>

  <rect x="20" y="80" width="170" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="105" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Functional</text>
  <text x="105" y="126" text-anchor="middle" font-size="9.5" fill="#64748b">PM gần như</text>
  <text x="105" y="140" text-anchor="middle" font-size="9.5" fill="#64748b">không có quyền,</text>
  <text x="105" y="154" text-anchor="middle" font-size="9.5" fill="#64748b">manager chức năng quyết</text>

  <rect x="210" y="80" width="170" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="295" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Weak Matrix</text>
  <text x="295" y="126" text-anchor="middle" font-size="9.5" fill="#64748b">PM như</text>
  <text x="295" y="140" text-anchor="middle" font-size="9.5" fill="#64748b">coordinator,</text>
  <text x="295" y="154" text-anchor="middle" font-size="9.5" fill="#64748b">quyền hạn chế</text>

  <rect x="400" y="80" width="170" height="90" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="485" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Balanced Matrix</text>
  <text x="485" y="126" text-anchor="middle" font-size="9.5" fill="#64748b">quyền chia sẻ</text>
  <text x="485" y="140" text-anchor="middle" font-size="9.5" fill="#64748b">giữa PM và</text>
  <text x="485" y="154" text-anchor="middle" font-size="9.5" fill="#64748b">manager chức năng</text>

  <rect x="590" y="80" width="170" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="675" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Strong Matrix</text>
  <text x="675" y="126" text-anchor="middle" font-size="9.5" fill="#64748b">PM full-time,</text>
  <text x="675" y="140" text-anchor="middle" font-size="9.5" fill="#64748b">nhiều quyền hơn</text>
  <text x="675" y="154" text-anchor="middle" font-size="9.5" fill="#64748b">manager chức năng</text>

  <rect x="780" y="80" width="200" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="880" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Projectized</text>
  <text x="880" y="126" text-anchor="middle" font-size="9.5" fill="#64748b">PM toàn quyền,</text>
  <text x="880" y="140" text-anchor="middle" font-size="9.5" fill="#64748b">team report thẳng</text>
  <text x="880" y="154" text-anchor="middle" font-size="9.5" fill="#64748b">cho PM</text>

  <text x="500" y="210" text-anchor="middle" font-size="10" fill="#64748b">Đề thi thường hỏi: "PM gặp khó vì không đủ quyền với team" → thường là Functional hoặc Weak Matrix.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
