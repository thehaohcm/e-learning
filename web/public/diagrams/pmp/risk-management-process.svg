<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Quy trình Risk Management: Identify, Qualitative Analysis, Quantitative Analysis, Plan Responses, Implement Responses, Monitor Risks, với vòng lặp quay lại Identify vì rủi ro mới có thể xuất hiện bất cứ lúc nào." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
    <marker id="r2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="10" y="50" width="150" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="85" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">1 · Identify</text>
  <text x="85" y="98" text-anchor="middle" font-size="9.5" fill="#64748b">Risks liệt kê vào</text>
  <text x="85" y="112" text-anchor="middle" font-size="9.5" fill="#64748b">risk register</text>

  <line x1="160" y1="90" x2="184" y2="90" stroke="#1e1b4b" stroke-width="2" marker-end="url(#r1)"/>

  <rect x="188" y="50" width="150" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="263" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">2 · Qualitative</text>
  <text x="263" y="94" text-anchor="middle" font-size="9.5" fill="#64748b">Probability × Impact</text>
  <text x="263" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">→ xếp hạng ưu tiên</text>

  <line x1="338" y1="90" x2="362" y2="90" stroke="#1e1b4b" stroke-width="2" marker-end="url(#r1)"/>

  <rect x="366" y="50" width="150" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="441" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">3 · Quantitative</text>
  <text x="441" y="94" text-anchor="middle" font-size="9.5" fill="#64748b">(tuỳ chọn, dự án lớn)</text>
  <text x="441" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">lượng hoá ảnh hưởng $/thời gian</text>

  <line x1="516" y1="90" x2="540" y2="90" stroke="#1e1b4b" stroke-width="2" marker-end="url(#r1)"/>

  <rect x="544" y="50" width="160" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="624" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">4 · Plan Responses</text>
  <text x="624" y="94" text-anchor="middle" font-size="9.5" fill="#64748b">Avoid / Transfer /</text>
  <text x="624" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">Mitigate / Accept</text>

  <line x1="704" y1="90" x2="728" y2="90" stroke="#1e1b4b" stroke-width="2" marker-end="url(#r1)"/>

  <rect x="732" y="50" width="150" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="807" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">5 · Implement</text>
  <text x="807" y="94" text-anchor="middle" font-size="9.5" fill="#64748b">Thực thi response</text>
  <text x="807" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">đã lên kế hoạch</text>

  <line x1="882" y1="90" x2="906" y2="90" stroke="#1e1b4b" stroke-width="2" marker-end="url(#r1)"/>

  <rect x="910" y="50" width="120" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="970" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">6 · Monitor</text>
  <text x="970" y="94" text-anchor="middle" font-size="9.5" fill="#64748b">Theo dõi risk</text>
  <text x="970" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">register</text>

  <path d="M970,130 C970,210 85,210 85,130" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r2)"/>
  <text x="520" y="222" text-anchor="middle" font-size="10.5" fill="#4f46e5" font-weight="600">lặp lại xuyên suốt dự án — rủi ro mới có thể xuất hiện bất cứ lúc nào</text>

  <text x="520" y="252" text-anchor="middle" font-size="10" fill="#64748b">Risk không phải việc làm 1 lần ở đầu dự án — Identify → Monitor chạy vòng tròn tới khi Closing.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
