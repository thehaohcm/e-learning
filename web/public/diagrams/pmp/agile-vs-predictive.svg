<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="So sánh Predictive và Agile: Predictive chạy một lượt Plan, Build, Verify, Deliver; Agile lặp vòng Sprint Planning, Build, Review, Retro nhiều lần, mỗi vòng ra một Product Increment cộng dồn thành release." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
    <marker id="b2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="12.5" font-weight="700" fill="#1e1b4b">Predictive (Waterfall)</text>
  <text x="20" y="42" font-size="10" fill="#64748b">scope cố định ngay từ Planning, chạy 1 lượt</text>

  <rect x="20" y="60" width="105" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="72" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1b4b">Plan</text>
  <rect x="150" y="60" width="105" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="202" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1b4b">Build</text>
  <rect x="280" y="60" width="105" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="332" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1b4b">Verify</text>
  <rect x="410" y="60" width="105" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="462" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1b4b">Deliver</text>
  <line x1="125" y1="88" x2="146" y2="88" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="255" y1="88" x2="276" y2="88" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="385" y1="88" x2="406" y2="88" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <text x="20" y="150" font-size="10" fill="#64748b">→ 1 bản kế hoạch, 1 baseline, giao 1 lần ở cuối</text>

  <line x1="555" y1="10" x2="555" y2="280" stroke="#cbd5e1" stroke-width="1"/>

  <text x="590" y="26" font-size="12.5" font-weight="700" fill="#1e1b4b">Agile (Scrum)</text>
  <text x="590" y="42" font-size="10" fill="#64748b">lặp lại từng sprint, chốt scope từng đợt nhỏ</text>

  <rect x="745" y="55" width="110" height="42" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="800" y="80" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e1b4b">Sprint Planning</text>
  <rect x="855" y="120" width="105" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="907" y="145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e1b4b">Build</text>
  <rect x="745" y="185" width="110" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="800" y="210" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e1b4b">Review</text>
  <rect x="635" y="120" width="100" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="685" y="145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e1b4b">Retro</text>

  <path d="M855,70 L850,70" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#b2)"/>
  <path d="M800,97 Q860,100 880,116" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#b2)"/>
  <path d="M907,162 Q870,185 859,190" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#b2)"/>
  <path d="M745,206 Q700,180 690,165" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#b2)"/>
  <path d="M685,118 Q720,90 742,78" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#b2)"/>
  <text x="800" y="258" text-anchor="middle" font-size="10" fill="#4f46e5" font-weight="600">lặp mỗi 2 tuần (1 sprint)</text>

  <line x1="800" y1="227" x2="800" y2="250" stroke="#1e1b4b" stroke-width="2" marker-end="url(#b1)"/>
  <text x="960" y="210" font-size="10" fill="#64748b">mỗi vòng → 1</text>
  <text x="960" y="223" font-size="10" fill="#64748b">Product Increment,</text>
  <text x="960" y="236" font-size="10" fill="#64748b">cộng dồn đến release</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
