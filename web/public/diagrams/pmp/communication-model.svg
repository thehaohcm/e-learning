<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Mô hình giao tiếp: Sender mã hoá thông điệp, gửi qua kênh truyền có nhiễu, Receiver giải mã, rồi gửi phản hồi ngược lại cho Sender." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="20" y="70" width="130" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="85" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e1b4b">Sender</text>
  <text x="85" y="118" text-anchor="middle" font-size="9.5" fill="#64748b">người gửi</text>

  <line x1="150" y1="105" x2="176" y2="105" stroke="#1e1b4b" stroke-width="2" marker-end="url(#m1)"/>
  <text x="163" y="95" text-anchor="middle" font-size="9" fill="#64748b">mã hoá</text>

  <rect x="180" y="55" width="260" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="310" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Thông điệp qua kênh (medium)</text>
  <text x="310" y="104" text-anchor="middle" font-size="9.5" fill="#64748b">email, họp, chat, báo cáo...</text>
  <path d="M220,122 q10,-10 20,0 q10,10 20,0 q10,-10 20,0 q10,10 20,0 q10,-10 20,0 q10,10 20,0" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="310" y="145" text-anchor="middle" font-size="9.5" fill="#b45309" font-weight="600">Noise (nhiễu) — làm sai lệch thông điệp</text>

  <line x1="440" y1="105" x2="466" y2="105" stroke="#1e1b4b" stroke-width="2" marker-end="url(#m1)"/>
  <text x="453" y="95" text-anchor="middle" font-size="9" fill="#64748b">giải mã</text>

  <rect x="470" y="70" width="130" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="535" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e1b4b">Receiver</text>
  <text x="535" y="118" text-anchor="middle" font-size="9.5" fill="#64748b">người nhận</text>

  <path d="M535,142 C535,210 85,210 85,142" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m2)"/>
  <text x="310" y="222" text-anchor="middle" font-size="10" fill="#4f46e5" font-weight="600">Feedback — xác nhận đã hiểu đúng, hoặc hỏi lại</text>

  <text x="700" y="80" font-size="10.5" font-weight="700" fill="#1e1b4b">Vì sao hay hiểu sai:</text>
  <text x="700" y="100" font-size="9.5" fill="#64748b">người gửi mã hoá không rõ,</text>
  <text x="700" y="115" font-size="9.5" fill="#64748b">kênh truyền không phù hợp,</text>
  <text x="700" y="130" font-size="9.5" fill="#64748b">noise (văn hoá, ngôn ngữ, cảm xúc),</text>
  <text x="700" y="145" font-size="9.5" fill="#64748b">người nhận giải mã sai bối cảnh.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
