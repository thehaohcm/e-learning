<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="5 process group của PMBOK nối tiếp nhau: Initiating, Planning, Executing, Closing; Monitoring and Controlling chạy liên tục bên dưới từ Planning đến Closing với 2 mũi tên phản hồi." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
    <marker id="a1u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="20" y="36" width="190" height="104" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="115" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">1 · INITIATING</text>
  <text x="115" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e1b4b">Khởi tạo</text>
  <text x="115" y="100" text-anchor="middle" font-size="10.5" fill="#64748b">Xác định dự án</text>
  <text x="115" y="115" text-anchor="middle" font-size="10.5" fill="#64748b">có đáng làm không</text>

  <rect x="240" y="36" width="230" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="355" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">2 · PLANNING</text>
  <text x="355" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e1b4b">Lập kế hoạch</text>
  <text x="355" y="100" text-anchor="middle" font-size="10.5" fill="#64748b">Scope / Schedule /</text>
  <text x="355" y="115" text-anchor="middle" font-size="10.5" fill="#64748b">Cost / Risk baseline</text>

  <rect x="500" y="36" width="300" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">3 · EXECUTING</text>
  <text x="650" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e1b4b">Thực thi</text>
  <text x="650" y="100" text-anchor="middle" font-size="10.5" fill="#64748b">Team làm ra deliverable,</text>
  <text x="650" y="115" text-anchor="middle" font-size="10.5" fill="#64748b">PM gỡ vướng, giao tiếp</text>

  <rect x="830" y="36" width="210" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="935" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">5 · CLOSING</text>
  <text x="935" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e1b4b">Kết thúc</text>
  <text x="935" y="100" text-anchor="middle" font-size="10.5" fill="#64748b">Nghiệm thu, chốt hợp</text>
  <text x="935" y="115" text-anchor="middle" font-size="10.5" fill="#64748b">đồng, lessons learned</text>

  <line x1="210" y1="88" x2="236" y2="88" stroke="#1e1b4b" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="470" y1="88" x2="496" y2="88" stroke="#1e1b4b" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="800" y1="88" x2="826" y2="88" stroke="#1e1b4b" stroke-width="2" marker-end="url(#a1)"/>

  <text x="115" y="165" text-anchor="middle" font-size="10" fill="#64748b">Output: Project Charter</text>
  <text x="355" y="165" text-anchor="middle" font-size="10" fill="#64748b">Output: Project Mgmt Plan</text>
  <text x="650" y="165" text-anchor="middle" font-size="10" fill="#64748b">Output: Deliverables, WP Data</text>
  <text x="935" y="165" text-anchor="middle" font-size="10" fill="#64748b">Output: Final Report</text>

  <rect x="240" y="230" width="800" height="90" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="640" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f46e5">4 · MONITORING &amp; CONTROLLING</text>
  <text x="640" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">đo kết quả thực tế · so với baseline (scope/schedule/cost)</text>
  <text x="640" y="298" text-anchor="middle" font-size="10.5" fill="#64748b">risk register · change requests — chạy liên tục, không phải 1 bước riêng</text>

  <path d="M355,230 L355,144" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#a1u)"/>
  <text x="368" y="195" font-size="10" fill="#4f46e5" font-weight="600">điều chỉnh</text>
  <path d="M650,230 L650,144" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#a1u)"/>
  <text x="663" y="195" font-size="10" fill="#4f46e5" font-weight="600">điều chỉnh</text>
  <path d="M935,230 L935,144" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#a1u)"/>
  <text x="880" y="195" font-size="10" fill="#4f46e5" font-weight="600" text-anchor="end">nghiệm thu dựa</text>
  <text x="880" y="208" font-size="10" fill="#4f46e5" font-weight="600" text-anchor="end">trên dữ liệu M&amp;C</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
