<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Phía trên: 5 giai đoạn Tuckman Forming, Storming, Norming, Performing, Adjourning nối tiếp nhau. Phía dưới: 5 kiểu xử lý xung đột đặt trên 2 trục quyết đoán và hợp tác." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="t1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
  </defs>

  <text x="20" y="22" font-size="11.5" font-weight="700" fill="#1e1b4b">Các giai đoạn phát triển team (Tuckman)</text>

  <rect x="20" y="36" width="160" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="60" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e1b4b">Forming</text>
  <text x="100" y="76" text-anchor="middle" font-size="9" fill="#64748b">làm quen, lịch sự</text>

  <line x1="180" y1="66" x2="202" y2="66" stroke="#1e1b4b" stroke-width="2" marker-end="url(#t1)"/>

  <rect x="206" y="36" width="160" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="286" y="60" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e1b4b">Storming</text>
  <text x="286" y="76" text-anchor="middle" font-size="9" fill="#64748b">xung đột, cạnh tranh</text>

  <line x1="366" y1="66" x2="388" y2="66" stroke="#1e1b4b" stroke-width="2" marker-end="url(#t1)"/>

  <rect x="392" y="36" width="160" height="60" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="472" y="60" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e1b4b">Norming</text>
  <text x="472" y="76" text-anchor="middle" font-size="9" fill="#64748b">thống nhất cách làm</text>

  <line x1="552" y1="66" x2="574" y2="66" stroke="#1e1b4b" stroke-width="2" marker-end="url(#t1)"/>

  <rect x="578" y="36" width="160" height="60" rx="8" fill="#ecfdf5" stroke="#0f7a52" stroke-width="1.5"/>
  <text x="658" y="60" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e1b4b">Performing</text>
  <text x="658" y="76" text-anchor="middle" font-size="9" fill="#64748b">hiệu suất cao, tự chủ</text>

  <line x1="738" y1="66" x2="760" y2="66" stroke="#1e1b4b" stroke-width="2" marker-end="url(#t1)"/>

  <rect x="764" y="36" width="200" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="864" y="60" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e1b4b">Adjourning</text>
  <text x="864" y="76" text-anchor="middle" font-size="9" fill="#64748b">dự án xong, team giải tán</text>

  <text x="20" y="150" font-size="11.5" font-weight="700" fill="#1e1b4b">5 kiểu xử lý xung đột (theo mức quyết đoán và hợp tác)</text>

  <line x1="100" y1="190" x2="100" y2="390" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="100" y1="390" x2="900" y2="390" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="178" text-anchor="middle" font-size="9.5" fill="#64748b">Quyết đoán cao</text>
  <text x="100" y="408" text-anchor="middle" font-size="9.5" fill="#64748b">Quyết đoán thấp</text>
  <text x="80" y="390" text-anchor="end" font-size="9.5" fill="#64748b">Hợp tác thấp</text>
  <text x="900" y="408" text-anchor="middle" font-size="9.5" fill="#64748b">Hợp tác cao</text>

  <circle cx="160" cy="370" r="7" fill="#64748b"/>
  <text x="160" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#1e1b4b">Withdraw</text>
  <text x="160" y="330" text-anchor="middle" font-size="9" fill="#64748b">(né tránh)</text>

  <circle cx="900" cy="370" r="7" fill="#0f7a52"/>
  <text x="900" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#1e1b4b">Smooth</text>
  <text x="900" y="330" text-anchor="middle" font-size="9" fill="#64748b">(xoa dịu)</text>

  <circle cx="500" cy="280" r="7" fill="#b45309"/>
  <text x="500" y="255" text-anchor="middle" font-size="10" font-weight="700" fill="#1e1b4b">Compromise</text>
  <text x="500" y="240" text-anchor="middle" font-size="9" fill="#64748b">(thoả hiệp, mỗi bên nhường 1 ít)</text>

  <circle cx="160" cy="210" r="7" fill="#b91c1c"/>
  <text x="160" y="205" text-anchor="start" font-size="10" font-weight="700" fill="#1e1b4b">Force</text>
  <text x="160" y="220" text-anchor="start" font-size="9" fill="#64748b">(áp đặt, thắng-thua)</text>

  <circle cx="900" cy="210" r="7" fill="#4f46e5"/>
  <text x="900" y="200" text-anchor="end" font-size="10" font-weight="700" fill="#1e1b4b">Collaborate</text>
  <text x="900" y="215" text-anchor="end" font-size="9" fill="#64748b">(cùng giải quyết, thắng-thắng)</text>
  <text x="900" y="228" text-anchor="end" font-size="9" fill="#64748b">— PMI khuyến khích nhất</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
