<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Vòng đời Procurement: Plan, Conduct, Control, Close; bên dưới là phổ loại hợp đồng từ Fixed Price (rủi ro cao cho seller) đến Time and Material đến Cost Plus Fixed Fee (rủi ro cao cho buyer)." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
  </defs>

  <rect x="20" y="40" width="190" height="78" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="115" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">1 · Plan Procurement</text>
  <text x="115" y="88" text-anchor="middle" font-size="9.5" fill="#64748b">make-or-buy, chọn loại</text>
  <text x="115" y="101" text-anchor="middle" font-size="9.5" fill="#64748b">hợp đồng, soạn SOW</text>

  <line x1="210" y1="79" x2="236" y2="79" stroke="#1e1b4b" stroke-width="2" marker-end="url(#p1)"/>

  <rect x="240" y="40" width="190" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="335" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">2 · Conduct Procurement</text>
  <text x="335" y="88" text-anchor="middle" font-size="9.5" fill="#64748b">mời thầu, đánh giá,</text>
  <text x="335" y="101" text-anchor="middle" font-size="9.5" fill="#64748b">chọn seller, ký hợp đồng</text>

  <line x1="430" y1="79" x2="456" y2="79" stroke="#1e1b4b" stroke-width="2" marker-end="url(#p1)"/>

  <rect x="460" y="40" width="190" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="555" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">3 · Control Procurement</text>
  <text x="555" y="88" text-anchor="middle" font-size="9.5" fill="#64748b">quản lý hợp đồng,</text>
  <text x="555" y="101" text-anchor="middle" font-size="9.5" fill="#64748b">theo dõi hiệu suất seller</text>

  <line x1="650" y1="79" x2="676" y2="79" stroke="#1e1b4b" stroke-width="2" marker-end="url(#p1)"/>

  <rect x="680" y="40" width="190" height="78" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="775" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">4 · Close Procurement</text>
  <text x="775" y="88" text-anchor="middle" font-size="9.5" fill="#64748b">nghiệm thu, thanh lý</text>
  <text x="775" y="101" text-anchor="middle" font-size="9.5" fill="#64748b">hợp đồng, lưu hồ sơ</text>

  <text x="20" y="165" font-size="11.5" font-weight="700" fill="#1e1b4b">Phổ loại hợp đồng theo rủi ro giá</text>
  <line x1="20" y1="210" x2="880" y2="210" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
  <circle cx="60" cy="210" r="7" fill="#0f7a52"/>
  <circle cx="450" cy="210" r="7" fill="#b45309"/>
  <circle cx="840" cy="210" r="7" fill="#b91c1c"/>
  <text x="60" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#1e1b4b">FFP</text>
  <text x="60" y="250" text-anchor="middle" font-size="9" fill="#64748b">Fixed Price</text>
  <text x="450" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#1e1b4b">T&amp;M</text>
  <text x="450" y="250" text-anchor="middle" font-size="9" fill="#64748b">Time &amp; Material</text>
  <text x="840" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#1e1b4b">CPFF</text>
  <text x="840" y="250" text-anchor="middle" font-size="9" fill="#64748b">Cost Plus Fixed Fee</text>
  <text x="20" y="275" font-size="10" fill="#64748b">← rủi ro giá nghiêng về seller</text>
  <text x="880" y="275" text-anchor="end" font-size="10" fill="#64748b">rủi ro giá nghiêng về buyer →</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
