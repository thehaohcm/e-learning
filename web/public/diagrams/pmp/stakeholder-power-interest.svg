<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Ma trận Power/Interest 4 ô: quyền lực thấp lãi ích thấp thì theo dõi tối thiểu; quyền lực cao lãi ích thấp thì giữ hài lòng; quyền lực thấp lãi ích cao thì giữ thông tin; quyền lực cao lãi ích cao thì quản lý sát sao." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">Stakeholder Power / Interest Grid</text>

  <line x1="110" y1="60" x2="110" y2="460" stroke="#1e1b4b" stroke-width="2" marker-end="url(#s1)"/>
  <line x1="110" y1="460" x2="580" y2="460" stroke="#1e1b4b" stroke-width="2" marker-end="url(#s1)"/>
  <text x="95" y="56" text-anchor="end" font-size="10.5" fill="#64748b" transform="rotate(0)">Power cao</text>
  <text x="130" y="455" font-size="10.5" fill="#64748b">Power thấp</text>
  <text x="565" y="478" text-anchor="end" font-size="10.5" fill="#64748b">Interest cao</text>
  <text x="130" y="478" font-size="10.5" fill="#64748b">Interest thấp</text>

  <line x1="345" y1="60" x2="345" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="110" y1="260" x2="580" y2="260" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="112" y="62" width="231" height="196" fill="#fef3c7" opacity="0.5"/>
  <text x="227" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Giữ hài lòng</text>
  <text x="227" y="168" text-anchor="middle" font-size="9.5" fill="#92400e">(Keep Satisfied)</text>
  <text x="227" y="186" text-anchor="middle" font-size="9" fill="#78350f">Power cao, Interest thấp —</text>
  <text x="227" y="200" text-anchor="middle" font-size="9" fill="#78350f">đừng để họ thấy bị bỏ qua</text>

  <rect x="347" y="62" width="231" height="196" fill="#fee2e2" opacity="0.5"/>
  <text x="462" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Quản lý sát sao</text>
  <text x="462" y="168" text-anchor="middle" font-size="9.5" fill="#991b1b">(Manage Closely)</text>
  <text x="462" y="186" text-anchor="middle" font-size="9" fill="#7f1d1d">Power cao, Interest cao —</text>
  <text x="462" y="200" text-anchor="middle" font-size="9" fill="#7f1d1d">ưu tiên giao tiếp hàng đầu</text>

  <rect x="112" y="262" width="231" height="196" fill="#e2e8f0" opacity="0.5"/>
  <text x="227" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Theo dõi tối thiểu</text>
  <text x="227" y="368" text-anchor="middle" font-size="9.5" fill="#475569">(Monitor)</text>
  <text x="227" y="386" text-anchor="middle" font-size="9" fill="#475569">Power thấp, Interest thấp —</text>
  <text x="227" y="400" text-anchor="middle" font-size="9" fill="#475569">tốn công sức tối thiểu</text>

  <rect x="347" y="262" width="231" height="196" fill="#dbeafe" opacity="0.5"/>
  <text x="462" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Giữ thông tin</text>
  <text x="462" y="368" text-anchor="middle" font-size="9.5" fill="#1e3a8a">(Keep Informed)</text>
  <text x="462" y="386" text-anchor="middle" font-size="9" fill="#1e3a8a">Power thấp, Interest cao —</text>
  <text x="462" y="400" text-anchor="middle" font-size="9" fill="#1e3a8a">cập nhật đều để họ yên tâm</text>

  <text x="320" y="500" text-anchor="middle" font-size="10" fill="#64748b">Dùng ma trận này để quyết định tần suất và độ chi tiết giao tiếp với từng stakeholder — không phải ai cũng cần báo cáo như nhau.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
