<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Quy trình Integrated Change Control: change request xuất hiện, được ghi nhận, đánh giá tác động, rồi CCB quyết định duyệt (cập nhật baseline) hoặc từ chối/hoãn (giữ nguyên baseline)." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
    <marker id="c2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7a52"/>
    </marker>
    <marker id="c3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="15" y="110" width="130" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Change</text>
  <text x="80" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">request xuất hiện</text>
  <text x="80" y="168" text-anchor="middle" font-size="9.5" fill="#64748b">(client, team, risk...)</text>

  <line x1="145" y1="144" x2="171" y2="144" stroke="#1e1b4b" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="175" y="110" width="130" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Ghi nhận</text>
  <text x="240" y="156" text-anchor="middle" font-size="9.5" fill="#64748b">(change log) — không</text>
  <text x="240" y="169" text-anchor="middle" font-size="9.5" fill="#64748b">tự ý làm ngay</text>

  <line x1="305" y1="144" x2="331" y2="144" stroke="#1e1b4b" stroke-width="2" marker-end="url(#c1)"/>

  <rect x="335" y="100" width="170" height="88" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="420" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Đánh giá tác động</text>
  <text x="420" y="145" text-anchor="middle" font-size="9.5" fill="#64748b">scope · schedule · cost</text>
  <text x="420" y="160" text-anchor="middle" font-size="9.5" fill="#64748b">risk · quality</text>
  <text x="420" y="175" text-anchor="middle" font-size="9.5" fill="#64748b">+ đề xuất phương án</text>

  <line x1="505" y1="144" x2="531" y2="144" stroke="#1e1b4b" stroke-width="2" marker-end="url(#c1)"/>

  <polygon points="620,100 695,144 620,188 545,144" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="620" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e1b4b">CCB</text>
  <text x="620" y="154" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e1b4b">duyệt?</text>

  <path d="M650,120 Q730,90 760,120" fill="none" stroke="#0f7a52" stroke-width="2" marker-end="url(#c2)"/>
  <text x="705" y="92" text-anchor="middle" font-size="10" fill="#0f7a52" font-weight="700">Có</text>

  <path d="M650,168 Q730,198 760,168" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#c3)"/>
  <text x="705" y="213" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">Không / hoãn</text>

  <rect x="765" y="80" width="140" height="68" rx="8" fill="#ecfdf5" stroke="#0f7a52" stroke-width="1.5"/>
  <text x="835" y="106" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e1b4b">Cập nhật baseline</text>
  <text x="835" y="122" text-anchor="middle" font-size="9.5" fill="#64748b">+ tài liệu dự án,</text>
  <text x="835" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">thực thi thay đổi</text>

  <rect x="765" y="190" width="140" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="835" y="216" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e1b4b">Giữ nguyên baseline</text>
  <text x="835" y="232" text-anchor="middle" font-size="9.5" fill="#64748b">ghi nhận lý do,</text>
  <text x="835" y="246" text-anchor="middle" font-size="9.5" fill="#64748b">báo lại người yêu cầu</text>

  <text x="420" y="270" text-anchor="middle" font-size="10" fill="#64748b">Từ chối hoặc hoãn vẫn là một outcome hợp lệ — không phải mọi change request đều phải được chấp nhận.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
