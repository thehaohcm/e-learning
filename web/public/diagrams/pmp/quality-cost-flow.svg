<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Phía trên: quy trình Plan Quality, Manage Quality (QA), Control Quality (QC), với vòng lặp cải tiến quay lại Plan Quality khi phát hiện vấn đề. Phía dưới: Cost of Quality chia thành Cost of Conformance (Prevention, Appraisal) và Cost of Nonconformance (Internal failure, External failure)." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="q1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b4b"/>
    </marker>
    <marker id="q2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="220" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="130" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Plan Quality Mgmt</text>
  <text x="130" y="78" text-anchor="middle" font-size="9.5" fill="#64748b">định tiêu chuẩn, chỉ số</text>
  <text x="130" y="92" text-anchor="middle" font-size="9.5" fill="#64748b">đo chất lượng ngay từ đầu</text>

  <line x1="240" y1="70" x2="264" y2="70" stroke="#1e1b4b" stroke-width="2" marker-end="url(#q1)"/>

  <rect x="268" y="30" width="220" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="378" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Manage Quality (QA)</text>
  <text x="378" y="78" text-anchor="middle" font-size="9.5" fill="#64748b">kiểm tra quy trình đang</text>
  <text x="378" y="92" text-anchor="middle" font-size="9.5" fill="#64748b">làm có theo chuẩn không</text>

  <line x1="488" y1="70" x2="512" y2="70" stroke="#1e1b4b" stroke-width="2" marker-end="url(#q1)"/>

  <rect x="516" y="30" width="220" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="626" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#1e1b4b">Control Quality (QC)</text>
  <text x="626" y="78" text-anchor="middle" font-size="9.5" fill="#64748b">kiểm tra deliverable đã</text>
  <text x="626" y="92" text-anchor="middle" font-size="9.5" fill="#64748b">làm xong, đúng/sai</text>

  <path d="M626,112 C626,165 130,165 130,112" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#q2)"/>
  <text x="378" y="150" text-anchor="middle" font-size="10" fill="#4f46e5" font-weight="600">phát hiện vấn đề → cải tiến quy trình, quay lại Plan</text>

  <text x="20" y="200" font-size="11.5" font-weight="700" fill="#1e1b4b">Cost of Quality</text>
  <line x1="500" y1="190" x2="500" y2="320" stroke="#cbd5e1" stroke-width="1"/>

  <text x="250" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f7a52">Cost of Conformance (chủ động)</text>
  <rect x="40" y="235" width="200" height="50" rx="8" fill="#ecfdf5" stroke="#0f7a52" stroke-width="1.5"/>
  <text x="140" y="256" text-anchor="middle" font-size="10" font-weight="600" fill="#1e1b4b">Prevention</text>
  <text x="140" y="272" text-anchor="middle" font-size="9" fill="#64748b">đào tạo, thiết kế đúng ngay từ đầu</text>
  <rect x="260" y="235" width="200" height="50" rx="8" fill="#ecfdf5" stroke="#0f7a52" stroke-width="1.5"/>
  <text x="360" y="256" text-anchor="middle" font-size="10" font-weight="600" fill="#1e1b4b">Appraisal</text>
  <text x="360" y="272" text-anchor="middle" font-size="9" fill="#64748b">kiểm tra, testing, audit</text>

  <text x="750" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">Cost of Nonconformance (bị động)</text>
  <rect x="540" y="235" width="200" height="50" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="640" y="256" text-anchor="middle" font-size="10" font-weight="600" fill="#1e1b4b">Internal failure</text>
  <text x="640" y="272" text-anchor="middle" font-size="9" fill="#64748b">lỗi phát hiện trước khi giao</text>
  <rect x="760" y="235" width="200" height="50" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="860" y="256" text-anchor="middle" font-size="10" font-weight="600" fill="#1e1b4b">External failure</text>
  <text x="860" y="272" text-anchor="middle" font-size="9" fill="#64748b">lỗi khách hàng phát hiện — đắt nhất</text>

  <text x="500" y="318" text-anchor="middle" font-size="10" fill="#64748b">Đầu tư Prevention/Appraisal càng nhiều → Internal/External failure càng ít. PMI luôn ưu tiên phòng ngừa hơn kiểm tra.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
