server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the "api" container at request time (Docker's internal DNS), so
    # nginx still starts and serves the website while the API is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # API and health check go to the Go server (also used by the ESP32 device)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 200s;   # AI generation can take up to ~3 minutes
        client_max_body_size 2m;
    }
    location = /health {
        proxy_pass $api_upstream;
    }

    # long cache for hashed assets, no cache for index.html
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
