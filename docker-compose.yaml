services:
  api:
    build: ./api
    container_name: mvp_api
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "${PORT:-5173}:${PORT:-5173}"
    command: ["/app/server"]
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads

  redis:
    image: redis:7-alpine
    container_name: mvp_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build: ./web
    container_name: mvp_web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5173}
    ports:
      - "8085:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uploads_data: