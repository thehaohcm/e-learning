services:
  # PostgreSQL. On the FIRST start it creates the user and database from
  # DB_USER / DB_PASSWORD / DB_NAME in .env. Tables are created by the API
  # (api/migrations run automatically on every start, only new ones are applied).
  # Data lives in the "db_data" volume: never run `docker compose down -v`.
  db:
    image: postgres:16-alpine
    container_name: elearn_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Not published to the internet. Admin access: docker compose exec db psql -U <user> -d <db>
    # To connect from your PC, use an SSH tunnel and uncomment:
    # ports:
    #   - "127.0.0.1:5432:5432"

  api:
    build: ./api
    container_name: elearn_api
    env_file:
      - .env
    environment:
      PORT: "8000"
      DB_HOST: db        # the db service above (overrides DB_HOST in .env)
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    # The web app calls /api on its own origin and nginx forwards it to the API,
    # so no API URL is baked into the build.
    build: ./web
    container_name: elearn_web
    ports:
      - "${WEB_PORT:-8085}:8080"   # website + /api for the ESP32 device
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
