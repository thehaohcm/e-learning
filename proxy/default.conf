# Edge proxy: public ports 80/443 -> web container (port 8080).
# Port 443 is enabled automatically when certs/origin.pem and certs/origin.key
# exist (see 40-enable-ssl.sh). Use a Cloudflare Origin Certificate for them.

include /etc/nginx/snippets/cloudflare-realip.conf;

# resolve containers at request time, so nginx starts even if "web" is restarting
resolver 127.0.0.11 valid=10s ipv6=off;

# https when the visitor used https at Cloudflare (Flexible mode) or here (Full mode)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    set $web_upstream web:8080;

    location / {
        include /etc/nginx/snippets/proxy_params.conf;
    }
}
